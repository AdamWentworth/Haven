name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify public build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Test security projection logic with coverage gates
        working-directory: web
        run: npm run test:coverage

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Audit frontend dependencies
        working-directory: web
        run: npm audit --audit-level=high

      - name: Verify Go module checksums
        run: go mod verify

      - name: Test Go packages with an internal coverage floor
        shell: bash
        run: |
          coverage_file="$(mktemp)"
          trap 'rm -f "${coverage_file}"' EXIT
          go test -coverprofile="${coverage_file}" ./internal/...
          coverage="$(go tool cover -func="${coverage_file}" | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')"
          echo "Internal Go statement coverage: ${coverage}%"
          awk -v coverage="${coverage}" 'BEGIN { if (coverage + 0 < 55) exit 1 }'

      - name: Run Go race detector
        run: go test -race ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Check reachable Go dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Check repository for private material
        shell: pwsh
        run: ./scripts/Test-PublicRepository.ps1

  verify-windows-agent:
    name: Verify console-free Windows agent
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Windows process isolation
        run: go test ./internal/action ./internal/collector ./internal/subprocess

      - name: Validate elevated reporter task contract
        shell: pwsh
        run: |
          $scriptPath = Join-Path $PWD 'scripts\Install-WindowsAgentTask.ps1'
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) {
            throw "Windows agent task installer has PowerShell parse errors: $($parseErrors.Message -join '; ')"
          }
          $source = Get-Content -LiteralPath $scriptPath -Raw
          if ($source -notmatch '(?s)New-ScheduledTaskPrincipal.+?-RunLevel\s+Highest') {
            throw 'Windows reporter must run at the highest available level to collect protected posture signals.'
          }
          if ($source -notmatch '(?s)Set-ScheduledTask.+?-Principal\s+\$principal') {
            throw 'Existing Windows reporter tasks must have their principal upgraded, not only their executable replaced.'
          }
          if ($source -notmatch 'WindowsBuiltInRole\]::Administrator') {
            throw 'Windows reporter installer must reject unelevated installation.'
          }

      - name: Build console-free reporter
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'haven-agent-background.exe'
          go build -trimpath -ldflags '-H=windowsgui' -o $output .\cmd\haven-agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bytes = [System.IO.File]::ReadAllBytes($output)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($subsystem -ne 2) { throw "Expected Windows GUI subsystem 2, got $subsystem." }

  publish-hub-image:
    name: Publish immutable hub image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, verify-windows-agent]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build CI-approved image
        env:
          IMAGE: ghcr.io/adamwentworth/haven-hub
        run: |
          docker build --pull \
            --build-arg "HAVEN_BUILD_SHA=${GITHUB_SHA}" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            --tag "${IMAGE}:main" \
            .

      - name: Publish CI-approved image
        env:
          IMAGE: ghcr.io/adamwentworth/haven-hub
        run: |
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:main"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  request-production-deployment:
    name: Request private HomeOps deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HOMEOPS_AUTO_DEPLOY == 'true'
    needs: publish-hub-image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Dispatch approved revision to HomeOps
        env:
          HOMEOPS_DISPATCH_TOKEN: ${{ secrets.HOMEOPS_DISPATCH_TOKEN }}
        run: |
          if [[ -z "${HOMEOPS_DISPATCH_TOKEN}" ]]; then
            echo "HOMEOPS_DISPATCH_TOKEN is not configured." >&2
            exit 1
          fi
          payload=$(jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg sha "${GITHUB_SHA}" \
            '{event_type:"deploy-haven",client_payload:{repository:$repository,sha:$sha}}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${HOMEOPS_DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/AdamWentworth/HomeOps/dispatches \
            --data "${payload}"
